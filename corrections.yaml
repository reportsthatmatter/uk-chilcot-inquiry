# Human judgements about this document's text, applied deterministically as a
# final pipeline pass, so re-running reproduces the same output.
#
# A correction describes the text; a pass describes how to read the source.
# Every correction must match exactly once, or the build fails naming its id.
version: 1
corrections:
  # The report sets its second-level bulleted sub-items in a dingbat font
  # that pdftotext maps to "{{" rather than the bullet glyph it uses for
  # first-level items (which extracts correctly as "•", visible on the same
  # lines). Eight sub-bullets across two nested lists come out this way;
  # each is restored to the bullet the first-level items around it use.
  - id: bullet-internecine
    find: "{{ internecine"
    replace: "• internecine"
  - id: bullet-terrorism
    find: "{{ terrorism"
    replace: "• terrorism"
  - id: bullet-iranian-interference
    find: "{{ Iranian interference"
    replace: "• Iranian interference"
  - id: bullet-un-authorisation
    find: "{{ UN authorisation"
    replace: "• UN authorisation"
  - id: bullet-un-framework
    find: "{{ a UN framework"
    replace: "• a UN framework"
  - id: bullet-strategic-intent
    find: "{{ Saddam Hussein's strategic intent"
    replace: "• Saddam Hussein's strategic intent"
  - id: bullet-regime-breaches
    find: "{{ the regime's breaches"
    replace: "• the regime's breaches"
  - id: bullet-positive-impact
    find: "{{ the positive impact"
    replace: "• the positive impact"
dismissed: []
