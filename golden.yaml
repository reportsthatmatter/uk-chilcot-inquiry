      - list: {start: "Although in earlier discussion he had “warmed to the idea”", end: "would have vetoed.”", items: 3}
      - paragraph: {start: "244. Mr Straw suggested that the UK should adopt a strategy", end: "reports of non-compliance."}
      - paragraph: {start: "245. Mr Straw also identified the need for a “Plan B”", end: "for military action."}
      - paragraph: {start: "246. Mr Straw concluded:", end: "concluded:"}
      - quote: {start: "“We will obviously need to discuss all this", end: "he wanted you alive not dead!”"}
      - paragraph: {start: "247. There was no reference in the minute to President Chirac’s remarks", end: "the previous evening."}
